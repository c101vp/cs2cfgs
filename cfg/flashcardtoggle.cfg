// toggle crosshair
// change this when changing the crosshair
// left = personal crosshair
// right = grenade crosshair
// grenade crosshair code: CSGO-P5Bck-DBJRz-p3f4q-CB5My-vnSmH
toggle cl_crosshair_length "1" "13"
toggle cl_crosshair_gap "4" "6"
toggle cl_crosshair_thickness "1" "2"
toggle cl_crosshaircolor_g "255" "190"
toggle cl_crosshairdot "1" "0"
// right now, the config is only configured to switch between my cross and nades crosshairs
// a smarter way to do this would be to make one config that, when executed, activates its respective crosshair
// but im too lazy to do that

// toggle hud and viewmodel
toggle cl_draw_only_deathnotices "1" "0"
toggle r_drawviewmodel "1" "0"
